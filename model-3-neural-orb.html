<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Darkuola — Neural Orb 3D Model</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:transparent; overflow:hidden; }
  canvas { display:block; }
  .label {
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.25em;
    text-transform:uppercase; color:rgba(251,146,60,.5);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Option 3 — Neural Orb</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(4, 0, 6);

// Core orb
const coreGeo = new THREE.SphereGeometry(0.9, 64, 64);
const coreMat = new THREE.MeshPhysicalMaterial({
  color: 0x0C0C16,
  metalness: 0.3,
  roughness: 0.05,
  transmission: 0.7,
  thickness: 1.2,
  ior: 1.5,
  transparent: true,
  opacity: 0.8,
  emissive: 0xFF3D6E,
  emissiveIntensity: 0.04,
});
const core = new THREE.Mesh(coreGeo, coreMat);
scene.add(core);

// Inner glow sphere
const innerGeo = new THREE.SphereGeometry(0.55, 32, 32);
const innerMat = new THREE.MeshBasicMaterial({
  color: 0xFF3D6E,
  transparent: true,
  opacity: 0.15,
});
const inner = new THREE.Mesh(innerGeo, innerMat);
scene.add(inner);

// Pulsing center
const pulseGeo = new THREE.SphereGeometry(0.25, 32, 32);
const pulseMat = new THREE.MeshBasicMaterial({
  color: 0xC084FC,
  transparent: true,
  opacity: 0.8,
});
const pulse = new THREE.Mesh(pulseGeo, pulseMat);
scene.add(pulse);

// Wireframe sphere over core
const wireGeo = new THREE.SphereGeometry(0.92, 18, 18);
const wireMat = new THREE.MeshBasicMaterial({
  color: 0xC084FC,
  wireframe: true,
  transparent: true,
  opacity: 0.08,
});
const wire = new THREE.Mesh(wireGeo, wireMat);
scene.add(wire);

// Orbiting rings — 3 at different angles
const ringData = [
  { color: 0xFF3D6E, tilt: 0,              speed: 0.6,  radius: 1.5, tube: 0.012 },
  { color: 0xC084FC, tilt: Math.PI/3,      speed: -0.4, radius: 1.7, tube: 0.01  },
  { color: 0xFB923C, tilt: Math.PI/1.7,    speed: 0.3,  radius: 1.9, tube: 0.008 },
];
const rings = ringData.map(d => {
  const geo = new THREE.TorusGeometry(d.radius, d.tube, 16, 120);
  const mat = new THREE.MeshBasicMaterial({
    color: d.color,
    transparent: true,
    opacity: 0.55,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = d.tilt;
  mesh.userData = d;
  scene.add(mesh);
  return mesh;
});

// Orbiting data nodes on each ring
const nodeGroup = new THREE.Group();
const nodeColors = [0xFF3D6E, 0xC084FC, 0xFB923C];
for(let r=0; r<3; r++){
  const ringR = 1.5 + r * 0.2;
  const tilt = ringData[r].tilt;
  const nodeCount = 6 + r * 2;
  for(let i=0; i<nodeCount; i++){
    const angle = (i / nodeCount) * Math.PI * 2;
    const nodeGeo = new THREE.SphereGeometry(0.025 + Math.random()*0.02, 8, 8);
    const nodeMat = new THREE.MeshBasicMaterial({
      color: nodeColors[r],
      transparent: true,
      opacity: 0.8,
    });
    const node = new THREE.Mesh(nodeGeo, nodeMat);
    // Place on ring
    const x = Math.cos(angle) * ringR;
    const y = Math.sin(angle) * ringR;
    node.position.set(x, y, 0);
    node.userData = { baseAngle: angle, ringR, tilt, ringIdx: r };
    nodeGroup.add(node);
  }
}
scene.add(nodeGroup);

// Connecting lines between nodes (neural network look)
const linesMaterial = new THREE.LineBasicMaterial({
  color: 0xC084FC,
  transparent: true,
  opacity: 0.06,
});
// Random neural connections from core outward
for(let i=0; i<30; i++){
  const pts = [];
  pts.push(new THREE.Vector3(0,0,0));
  const phi = Math.random() * Math.PI * 2;
  const theta = Math.random() * Math.PI;
  const r = 0.9 + Math.random() * 1;
  pts.push(new THREE.Vector3(
    r * Math.sin(theta) * Math.cos(phi),
    r * Math.sin(theta) * Math.sin(phi),
    r * Math.cos(theta)
  ));
  const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
  const line = new THREE.Line(lineGeo, linesMaterial);
  scene.add(line);
}

// Particle cloud around orb
const partGeo = new THREE.BufferGeometry();
const partCount = 200;
const partPos = new Float32Array(partCount * 3);
for(let i=0; i<partCount; i++){
  const r = 2.2 + Math.random() * 1.2;
  const phi = Math.random() * Math.PI * 2;
  const theta = Math.random() * Math.PI;
  partPos[i*3]   = r * Math.sin(theta) * Math.cos(phi);
  partPos[i*3+1] = r * Math.sin(theta) * Math.sin(phi);
  partPos[i*3+2] = r * Math.cos(theta);
}
partGeo.setAttribute('position', new THREE.BufferAttribute(partPos, 3));
const partMat = new THREE.PointsMaterial({
  color: 0xC084FC,
  size: 0.025,
  transparent: true,
  opacity: 0.35,
  sizeAttenuation: true,
});
const parts = new THREE.Points(partGeo, partMat);
scene.add(parts);

// Lights
const roseLight = new THREE.PointLight(0xFF3D6E, 5, 10);
roseLight.position.set(3, 2, 2);
scene.add(roseLight);
const lavLight = new THREE.PointLight(0xC084FC, 4, 10);
lavLight.position.set(-3, -1, 1);
scene.add(lavLight);
const amberLight = new THREE.PointLight(0xFB923C, 2, 8);
amberLight.position.set(0, -3, 1);
scene.add(amberLight);
const ambient = new THREE.AmbientLight(0x0C0C16, 2);
scene.add(ambient);

// Mouse
let mx = 0, my = 0;
document.addEventListener('mousemove', e => {
  mx = (e.clientX / window.innerWidth - 0.5);
  my = (e.clientY / window.innerHeight - 0.5);
});

let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.008;

  // Core breathes
  const s = 1 + Math.sin(t * 1.8) * 0.03;
  core.scale.setScalar(s);
  wire.scale.setScalar(s * 1.01);
  inner.scale.setScalar(1 + Math.sin(t * 2.2) * 0.08);
  innerMat.opacity = 0.1 + Math.sin(t * 2) * 0.07;
  pulse.scale.setScalar(0.8 + Math.sin(t * 3) * 0.3);
  pulseMat.opacity = 0.4 + Math.sin(t * 3) * 0.35;

  // Core slow mouse follow
  core.rotation.y = mx * 0.4 + t * 0.15;
  core.rotation.x = -my * 0.3;
  wire.rotation.copy(core.rotation);

  // Rings spin
  rings.forEach((ring, i) => {
    ring.rotation.z += ring.userData.speed * 0.012;
  });

  // Nodes follow their rings
  nodeGroup.children.forEach(node => {
    const d = node.userData;
    const speed = ringData[d.ringIdx].speed * 0.012;
    d.baseAngle += speed;
    node.position.x = Math.cos(d.baseAngle) * d.ringR;
    node.position.y = Math.sin(d.baseAngle) * d.ringR;
    // Apply ring tilt
    if(d.tilt !== 0) {
      const y2 = node.position.y * Math.cos(d.tilt);
      const z2 = node.position.y * Math.sin(d.tilt);
      node.position.y = y2;
      node.position.z = z2;
    }
  });

  // Float
  const floatY = Math.sin(t * 0.5) * 0.1;
  core.position.y = floatY;
  inner.position.y = floatY;
  pulse.position.y = floatY;
  wire.position.y = floatY;
  rings.forEach(r => r.position.y = floatY);
  nodeGroup.position.y = floatY;

  // Particles drift
  parts.rotation.y = t * 0.04;
  parts.rotation.x = t * 0.02;

  // Lights orbit
  roseLight.position.x = Math.sin(t * 0.7) * 3;
  roseLight.position.z = Math.cos(t * 0.7) * 2;
  lavLight.position.x = Math.cos(t * 0.5) * 3;
  lavLight.intensity = 3 + Math.sin(t * 1.5) * 1.5;

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
